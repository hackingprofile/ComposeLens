schema: composelens.fixtax.v0
fixtures:
  - id: yaml.simple
    feature: yaml
    kind: baseline
    description: Two services with YAML source locations preserved
    provenance: {source: synthetic, note: parse fixture}
    files: [yaml/simple.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: parse-services
        services: [web, db]
  - id: yaml.anchors
    feature: yaml
    kind: baseline
    description: Anchors, aliases, and merge keys survive parse
    provenance: {source: synthetic, note: parse fixture}
    files: [yaml/anchors.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: parse-services
        services: [web, worker]
  - id: yaml.json
    feature: yaml
    kind: baseline
    description: JSON Compose file parsed via YAML
    provenance: {source: synthetic, note: parse fixture}
    files: [yaml/compose.json]
    expected:
      engine: pending-engine
      local:
        assertion: parse-services
        services: [api]
  - id: paths.windows
    feature: paths
    kind: platform
    description: Windows path join/clean cases
    provenance: {source: synthetic, note: cross-platform fixture}
    files: [paths/windows.json]
    expected:
      engine: pending-engine
      local: {assertion: path-cases, goos: windows}
  - id: paths.posix
    feature: paths
    kind: platform
    description: POSIX path join/clean cases
    provenance: {source: synthetic, note: cross-platform fixture}
    files: [paths/posix.json]
    expected:
      engine: pending-engine
      local: {assertion: path-cases, goos: posix}

  - id: interpolation.official
    feature: interpolation
    kind: baseline
    description: Compose specification interpolation forms
    provenance: {source: official, note: Compose specification examples; engine config not compared}
    files: [interpolation/official.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: interp-path-states
        env:
          IMAGE: nginx:1.27-alpine
          HOST: web.local
          ENTRY: "1"
          FLAG: ""
          MUST: present
          MAYBE: ""
        paths:
          - {path: services.official.image, resolved: nginx:1.27-alpine, state: resolved}
          - {path: services.official.hostname, resolved: web.local, state: resolved}
          - {path: services.official.working_dir, resolved: /app, state: defaulted}
          - {path: services.official.environment.LITERAL_DOLLAR, resolved: $VAR, state: escaped-literal}
  - id: interpolation.issues
    feature: interpolation
    kind: regression
    description: Empty vs unset, adjacent text, unrecognized dollar; recursive defaults deferred
    provenance: {source: issue-derived}
    files: [interpolation/issues.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: interp-path-states
        env: {IMAGE: nginx, QUOTED: quoted-host, EMPTY: ""}
        paths:
          - {path: services.issues.image, resolved: pre-nginx-post, state: resolved}
          - {path: services.issues.environment.FALLBACK_EMPTY, resolved: fallback, state: defaulted}
          - {path: services.issues.environment.NESTED_DEFAULT, resolved: "", state: defaulted}

  - id: interpolation.corpus.var-set-unset
    feature: interpolation
    kind: baseline
    description: ${VAR} set vs unset (unset → empty)
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/var-set-unset/compose.yaml, corpus/interp/var-set-unset/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.image, value: alpine}
        - {path: services.web.hostname, value: prepost}
        - {path: web:SET, value: hello}
      local:
        assertion: interp-path-states
        env: {IMAGE: alpine, SETVAR: hello}
        paths:
          - {path: services.web.image, resolved: alpine, state: resolved}
          - {path: services.web.hostname, resolved: prepost, state: absent-empty}
          - {path: services.web.environment.SET, resolved: hello, state: resolved}
  - id: interpolation.corpus.colon-default
    feature: interpolation
    kind: baseline
    description: ${VAR:-default} empty and unset
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/colon-default/compose.yaml, corpus/interp/colon-default/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:FROM_EMPTY, value: fallback}
        - {path: web:FROM_UNSET, value: fallback}
        - {path: web:FROM_SET, value: kept}
      local:
        assertion: interp-path-states
        env: {EMPTY: "", SET: kept}
        paths:
          - {path: services.web.environment.FROM_EMPTY, resolved: fallback, state: defaulted}
          - {path: services.web.environment.FROM_UNSET, resolved: fallback, state: defaulted}
          - {path: services.web.environment.FROM_SET, resolved: kept, state: resolved}
  - id: interpolation.corpus.dash-default
    feature: interpolation
    kind: baseline
    description: ${VAR-default} unset vs empty kept
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/dash-default/compose.yaml, corpus/interp/dash-default/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:FROM_EMPTY, value: xx}
        - {path: web:FROM_UNSET, value: fallback}
        - {path: web:FROM_SET, value: kept}
      local:
        assertion: interp-path-states
        env: {EMPTY: "", SET: kept}
        paths:
          - {path: services.web.environment.FROM_EMPTY, resolved: xx, state: resolved}
          - {path: services.web.environment.FROM_UNSET, resolved: fallback, state: defaulted}
          - {path: services.web.environment.FROM_SET, resolved: kept, state: resolved}
  - id: interpolation.corpus.required-ok
    feature: interpolation
    kind: baseline
    description: ${VAR:?err} and ${VAR?err} when set or empty-ok
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/required-ok/compose.yaml, corpus/interp/required-ok/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:REQUIRED, value: present}
        - {path: web:OPTIONAL_REQUIRED, value: ab}
      local:
        assertion: interp-path-states
        env: {MUST: present, MAYBE: ""}
        paths:
          - {path: services.web.environment.REQUIRED, resolved: present, state: resolved}
          - {path: services.web.environment.OPTIONAL_REQUIRED, resolved: ab, state: resolved}
  - id: interpolation.corpus.required-unset
    feature: interpolation
    kind: baseline
    description: ${VAR:?err} when unset — live engine interpolation error
    provenance: {source: synthetic, note: "baseline; live docker compose v5.4.0 fails config"}
    files: [corpus/interp/required-unset/compose.yaml]
    expected:
      engine: engine-error
      enginePin: v5.4.0
      local:
        assertion: interp-path-states
        paths:
          - {path: services.web.environment.REQUIRED, resolved: "", state: required-error}
  - id: interpolation.corpus.plus-alt
    feature: interpolation
    kind: baseline
    description: ${VAR:+alt} and ${VAR+alt}
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/plus-alt/compose.yaml, corpus/interp/plus-alt/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:COLON_SET, value: "yes"}
        - {path: web:COLON_EMPTY, value: xx}
        - {path: web:COLON_UNSET, value: xx}
        - {path: web:PLUS_SET, value: "yes"}
        - {path: web:PLUS_EMPTY, value: "yes"}
        - {path: web:PLUS_UNSET, value: xx}
      local:
        assertion: interp-path-states
        env: {FLAG: on, EMPTY: ""}
        paths:
          - {path: services.web.environment.COLON_SET, resolved: "yes", state: resolved}
          - {path: services.web.environment.COLON_EMPTY, resolved: xx, state: absent-empty}
          - {path: services.web.environment.PLUS_EMPTY, resolved: "yes", state: resolved}
  - id: interpolation.corpus.escape
    feature: interpolation
    kind: baseline
    description: "$$ escaping; live runtime $VAR / ${notavar} / pre-$HOME-post MATCH (dump prints $$)"
    provenance: {source: synthetic, note: "escaped-literal; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/escape/compose.yaml]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:LITERAL, value: "$VAR"}
        - {path: web:LITERAL_BRACED, value: "${notavar}"}
        - {path: web:MIXED, value: "pre-$HOME-post"}
      local:
        assertion: interp-path-states
        paths:
          - {path: services.web.environment.LITERAL, resolved: "$VAR", state: escaped-literal}
          - {path: services.web.environment.LITERAL_BRACED, resolved: "${notavar}", state: escaped-literal}
          - {path: services.web.environment.MIXED, resolved: "pre-$HOME-post", state: escaped-literal}
  - id: interpolation.corpus.bare-adjacent
    feature: interpolation
    kind: baseline
    description: Bare $VAR, adjacent text, consecutive vars
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/bare-adjacent/compose.yaml, corpus/interp/bare-adjacent/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.hostname, value: web}
        - {path: web:BARE, value: web}
        - {path: web:ADJACENT, value: prewebpost}
        - {path: web:CONSEC, value: webweb}
      local:
        assertion: interp-path-states
        env: {HOST: web}
        paths:
          - {path: services.web.hostname, resolved: web, state: resolved}
          - {path: services.web.environment.BARE, resolved: web, state: resolved}
          - {path: services.web.environment.ADJACENT, resolved: prewebpost, state: resolved}
          - {path: services.web.environment.CONSEC, resolved: webweb, state: resolved}
  - id: interpolation.corpus.default-ref
    feature: interpolation
    kind: baseline
    description: Default that references another variable; the reference inside the default is expanded as the engine does (other-value)
    provenance: {source: synthetic, note: "nested default; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/default-ref/compose.yaml, corpus/interp/default-ref/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:NESTED, value: other-value}
      local:
        assertion: interp-path-states
        env: {OTHER: other-value}
        paths:
          - {path: services.web.environment.NESTED, resolved: other-value, state: defaulted}
  - id: interpolation.corpus.workdir-default
    feature: interpolation
    kind: baseline
    description: ${VAR:-default} on working_dir
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/workdir-default/compose.yaml]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.working_dir, value: /app}
        - {path: services.web.image, value: alpine}
      local:
        assertion: interp-path-states
        paths:
          - {path: services.web.working_dir, resolved: /app, state: defaulted}
  - id: interpolation.corpus.user-dash
    feature: interpolation
    kind: baseline
    description: ${VAR-default} on user
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/interp/user-dash/compose.yaml]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.user, value: nobody}
        - {path: services.web.image, value: alpine}
      local:
        assertion: interp-path-states
        paths:
          - {path: services.web.user, resolved: nobody, state: defaulted}

  - id: merge.overlay
    feature: merge
    kind: baseline
    description: Scalar override, map deep-merge, sequence append
    provenance: {source: official, note: Compose overlay examples}
    files: [merge/base.yaml, merge/overlay.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: merge-path-equals
        paths:
          - {path: services.web.image, value: redis}
          - {path: services.web.hostname, value: from-base}
          - {path: services.web.environment.C, value: three}
          - {path: services.web.ports, value: "[80:80, 443:443, 8080:80]"}
  - id: merge.three-file
    feature: merge
    kind: baseline
    description: Last scalar wins across three files
    provenance: {source: official}
    files: [merge/base.yaml, merge/overlay.yaml, merge/third.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: merge-path-equals
        paths:
          - {path: services.web.image, value: alpine}
  - id: merge.reset
    feature: merge
    kind: regression
    description: "!reset clears a mapping branch"
    provenance: {source: issue-derived}
    files: [merge/base.yaml, merge/reset.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: merge-path-equals
        paths:
          - {path: services.web.environment, action: reset}
  - id: merge.override-tag
    feature: merge
    kind: regression
    description: "!override replaces a mapping instead of deep-merge"
    provenance: {source: issue-derived}
    files: [merge/base.yaml, merge/override.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: merge-path-equals
        paths:
          - {path: services.web.environment.ONLY, value: kept}
          - {path: services.web.environment.A, absentPath: true}

  - id: profiles.official
    feature: profiles
    kind: baseline
    description: Always-on core vs profile-gated services with no active profile
    provenance: {source: official}
    files: [profiles/official.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: profiles-states
        paths:
          - {path: web, state: enabled}
          - {path: debug, state: disabled}
          - {path: worker, state: disabled}
  - id: profiles.depends
    feature: profiles
    kind: regression
    description: Profiled depends_on target is not auto-enabled (certainty unknown)
    provenance: {source: issue-derived, note: profiled depends_on not auto-enabled}
    files: [profiles/depends.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: profiles-states
        paths:
          - {path: web, state: enabled}
          - {path: db, state: disabled, certainty: unknown}

  - id: include.short
    feature: include
    kind: baseline
    description: Short-form include with including-file override
    provenance: {source: official}
    files: [include/short/compose.yaml, include/short/base.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-merge-path
        paths:
          - {path: services.web.image, value: overridden}
          - {path: services.web.hostname, value: keep}
  - id: include.long
    feature: include
    kind: baseline
    description: Long-form include path
    provenance: {source: official}
    files: [include/long/compose.yaml, include/long/base.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-ref
        form: long
        state: ok
  - id: include.long-extras
    feature: include
    kind: adversarial
    description: Long-form env_file and project_directory are not applied
    provenance: {source: official, note: extras recorded unknown, not applied}
    files: [include/long-extras/compose.yaml, include/long-extras/base.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-ref
        form: long
        certainty: unknown
        minUnsupported: 2
  - id: include.multi
    feature: include
    kind: baseline
    description: Multiple includes in order
    provenance: {source: official}
    files: [include/multi/compose.yaml, include/multi/a.yaml, include/multi/b.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-merge-path
        paths:
          - {path: services.web.image, value: three}
  - id: include.nested
    feature: include
    kind: baseline
    description: Nested includes
    provenance: {source: official}
    files: [include/nested/compose.yaml, include/nested/mid.yaml, include/nested/inner.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-merge-path
        paths:
          - {path: services.inner.image, value: alpine}
          - {path: services.web.image, value: nginx}
  - id: include.cycle
    feature: include
    kind: adversarial
    description: Include cycle is typed, not hung
    provenance: {source: synthetic}
    files: [include/cycle/a.yaml, include/cycle/b.yaml]
    entry: include/cycle/a.yaml
    expected:
      engine: pending-engine
      local:
        assertion: include-ref
        hasCycle: true
  - id: include.override
    feature: include
    kind: baseline
    description: Including file wins over included base
    provenance: {source: official}
    files: [include/override/compose.yaml, include/override/base.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: include-merge-path
        paths:
          - {path: services.web.image, value: overridden}

  - id: extends.same-file
    feature: extends
    kind: baseline
    description: Mapping-form same-file extends with local override
    provenance: {source: official}
    files: [extends/same-file/compose.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: extends-field
        paths:
          - {path: services.cli.image, value: busybox}
          - {path: services.cli.environment.PORT, value: "8080"}
  - id: extends.cross-file
    feature: extends
    kind: baseline
    description: Cross-file mapping-form extends
    provenance: {source: official}
    files: [extends/cross-file/compose.yaml, extends/cross-file/base.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: extends-field
        paths:
          - {path: services.web.image, value: alpine}
          - {path: services.web.hostname, value: from-file}
  - id: extends.relationship
    feature: extends
    kind: baseline
    description: Relationship keys are not inherited
    provenance: {source: official}
    files: [extends/relationship/compose.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: extends-field
        paths:
          - {path: services.cli.depends_on, absentPath: true}
  - id: extends.cycle
    feature: extends
    kind: adversarial
    description: Extends cycle is typed
    provenance: {source: synthetic}
    files: [extends/cycle/compose.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: extends-ref
        hasCycle: true
  - id: extends.short-form
    feature: extends
    kind: adversarial
    description: String short-form extends is unsupported
    provenance: {source: official}
    files: [extends/short-form/compose.yaml]
    expected:
      engine: pending-engine
      local:
        assertion: extends-ref
        service: cli
        state: unsupported

  - id: containerenv.override
    feature: container-env
    kind: baseline
    description: "environment: wins over env_file"
    provenance: {source: official, note: "live-pinned docker compose v5.4.0"}
    files: [containerenv/override/compose.yaml, containerenv/override/a.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:COLOR, value: from-compose}
        - {path: web:SHARED, value: file}
      local:
        assertion: containerenv-var
        key: COLOR
        value: from-compose
        state: environment
  - id: containerenv.order
    feature: container-env
    kind: baseline
    description: Later env_file overrides earlier
    provenance: {source: official, note: "live-pinned docker compose v5.4.0"}
    files: [containerenv/order/compose.yaml, containerenv/order/a.env, containerenv/order/b.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:SHARED, value: from-b}
        - {path: web:ONLY_A, value: a}
        - {path: web:ONLY_B, value: b}
      local:
        assertion: containerenv-var
        key: SHARED
        value: from-b
  - id: containerenv.passthrough
    feature: container-env
    kind: baseline
    description: List-form KEY pass-through from host shell
    provenance: {source: official, note: "live-pinned docker compose v5.4.0"}
    files: [containerenv/passthrough/compose.yaml]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:DEBUG, value: from-shell}
        - {path: web:COLOR, value: blue}
      local:
        assertion: containerenv-var
        key: DEBUG
        value: from-shell
        state: host-shell
        hostEnv: {DEBUG: from-shell}
  - id: containerenv.multi
    feature: container-env
    kind: baseline
    description: Multiple env_file sources then environment winner
    provenance: {source: official, note: "live-pinned docker compose v5.4.0"}
    files: [containerenv/multi/compose.yaml, containerenv/multi/a.env, containerenv/multi/b.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:COLOR, value: from-compose}
      local:
        assertion: containerenv-var
        key: COLOR
        value: from-compose
  - id: containerenv.corpus.dotenv-vs-environment
    feature: container-env
    kind: baseline
    description: "Project .env vs environment: (environment wins)"
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/precedence/dotenv-vs-environment/compose.yaml, corpus/precedence/dotenv-vs-environment/.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:COLOR, value: from-compose}
        - {path: services.web.image, value: alpine}
      local:
        assertion: containerenv-var
        key: COLOR
        value: from-compose
        state: environment
  - id: containerenv.corpus.envfile-cli
    feature: container-env
    kind: baseline
    description: --env-file replaces project .env for interpolation (PINNED lives in extra.env)
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/precedence/envfile-cli/compose.yaml, corpus/precedence/envfile-cli/.env, corpus/precedence/envfile-cli/extra.env]
    envFiles: [corpus/precedence/envfile-cli/extra.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.hostname, value: from-extra}
        - {path: web:PINNED, value: from-extra}
      local:
        assertion: interp-path-states
        env: {PINNED: from-extra}
        paths:
          - {path: services.web.hostname, resolved: from-extra, state: resolved}
          - {path: services.web.environment.PINNED, resolved: from-extra, state: resolved}
  - id: interpolation.corpus.envfile-replaces-dotenv
    feature: interpolation
    kind: baseline
    description: --env-file replaces project .env; TAG only in .env is dropped
    provenance: {source: synthetic, note: "env-file precedence repair; live-pinned docker compose v5.4.0"}
    files: [corpus/precedence/envfile-replaces-dotenv/compose.yaml, corpus/precedence/envfile-replaces-dotenv/.env, corpus/precedence/envfile-replaces-dotenv/extra.env]
    envFiles: [corpus/precedence/envfile-replaces-dotenv/extra.env]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: services.web.image, value: "nginx:"}
        - {path: services.web.hostname, value: repro-host}
      local:
        assertion: interp-path-states
        env: {HOSTV: repro-host}
        paths:
          - {path: services.web.image, resolved: "nginx:", state: absent-empty}
          - {path: services.web.hostname, resolved: repro-host, state: resolved}
  - id: containerenv.corpus.list-form
    feature: container-env
    kind: baseline
    description: environment list form
    provenance: {source: synthetic, note: "baseline; live-pinned docker compose v5.4.0"}
    files: [corpus/precedence/list-form/compose.yaml]
    expected:
      engine: matched
      enginePin: v5.4.0
      engineFields:
        - {path: web:COLOR, value: from-list}
        - {path: web:NAME, value: web}
      local:
        assertion: containerenv-var
        key: COLOR
        value: from-list
        state: environment
