<svg xmlns="http://www.w3.org/2000/svg" width="980" height="256" viewBox="0 0 980 256" role="img">
<title>composelens output: cd examples/readme-demo &amp;&amp; composelens check</title>
<rect width="980" height="256" rx="10" fill="#0d1626"/>
<rect width="980" height="30" rx="10" fill="#18243a"/>
<rect y="20" width="980" height="10" fill="#18243a"/>
<circle cx="20" cy="15" r="6" fill="#ff5f57"/>
<circle cx="40" cy="15" r="6" fill="#febc2e"/>
<circle cx="60" cy="15" r="6" fill="#28c840"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
<text x="18" y="58" fill="#7fd1ff">$ cd examples/readme-demo &amp;&amp; composelens check</text>
<text x="18" y="76" fill="#d6e2f5"></text>
<text x="18" y="94" fill="#d6e2f5">ComposeLens check — fixed ruleset over existing stage provenance — not a policy engine, not a provenance graph</text>
<text x="18" y="112" fill="#d6e2f5"></text>
<text x="18" y="130" fill="#d6e2f5">ruleset: fixed-v0</text>
<text x="18" y="148" fill="#d6e2f5">findings: 1  errors: 0  warnings: 1  info: 0  waived: 0</text>
<text x="18" y="166" fill="#d6e2f5">gate: error</text>
<text x="18" y="184" fill="#d6e2f5">warnings:</text>
<text x="18" y="202" fill="#d6e2f5">  CHK01  warning  api:API_KEY</text>
<text x="18" y="220" fill="#d6e2f5">    secret-keyed or secret-looking value is defined inline in the Compose model; use an external secret source instead</text>
<text x="18" y="238" fill="#d6e2f5">    provenance: container-environment:environment, interpolation:defaulted</text>
</g>
</svg>
