# Example consumer workflow for the ComposeLens composite Action on pull requests.
# Third-party actions are pinned by full 40-hex-char commit SHA (same pins as
# .github/workflows/ci.yml). Do not treat readable tags as pins.

name: example-composelens

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: composelens-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Composite Action in this repository. Builds composelens FROM SOURCE
      # (no GitHub Release download). Annotations are GitHub workflow commands
      # on the log; this example does not call the GitHub API.
      - name: ComposeLens check
        uses: ./
        with:
          project-directory: examples/readme-demo
          fail-on: error
          emit-json: "true"
          emit-sarif: "true"
          emit-summary: "true"
          emit-annotations: "true"
