# Action pins are immutable full 40-hex-char commit SHAs. Readable tags
# are comments only (same style as .github/workflows/ci.yml).
#
# Least privilege: results are not published (publish_results: false) and no
# step uploads SARIF, so the job needs no id-token or security-events write.
# The action's container image (docker://ghcr.io/ossf/scorecard-action:v2.4.4
# in its action.yaml) is referenced by tag, not by digest.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
