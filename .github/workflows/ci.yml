# Action pins are immutable full commit SHAs. Readable tags are comments only.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Live tests run `docker compose config` (client-side; no daemon) and
    # record the Compose version they ran against. Linux and Windows runners
    # ship the Docker CLI, so those legs require it; the macOS runner has no
    # Docker CLI, so its live tests skip with a stated reason.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            require_docker: "1"
            race: true
          - os: macos-latest
            require_docker: "0"
            race: false
          - os: windows-latest
            require_docker: "1"
            race: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          COMPOSELENS_REQUIRE_DOCKER: ${{ matrix.require_docker }}
        run: go test ./...

      - name: Test with the race detector
        if: ${{ matrix.race }}
        env:
          COMPOSELENS_REQUIRE_DOCKER: ${{ matrix.require_docker }}
        run: go test -race ./...

      - name: Build
        shell: bash
        run: go build -o "composelens$(go env GOEXE)" ./cmd/composelens

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./...
